name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & Lint (Ruff + Flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint Tools
        run: python -m pip install --no-cache-dir ruff==0.17.6 flake8==7.3.0

      - name: Run Ruff Check, Format & Flake8
        run: |
          python -m ruff check src tests main.py
          python -m ruff format --check src tests main.py
          python -m flake8 --max-line-length=120 src tests main.py

  test:
    name: Automated Test Suite (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.0.3 pytest-cov==7.1.0

      - name: Run Pytest with Coverage Gate
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=75

      - name: CLI Offline Smoke Check
        run: |
          python main.py --health
          python main.py --demo --sample-limit 300

  build-and-security:
    name: Docker Build & Security Scans
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/python

      - name: Build Hardened Docker Image
        run: docker build -t bank-customer-segmentation:ci .

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bank-customer-segmentation:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
