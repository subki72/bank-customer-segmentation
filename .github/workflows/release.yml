name: Release Pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Verify & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Run Tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.0.3 pytest-cov==7.1.0
          python -m pytest tests/ -v --cov=src --cov-fail-under=75

      - name: Build Release Container Image
        run: docker build -t bank-customer-segmentation:${{ github.ref_name }} .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
