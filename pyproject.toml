[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-customer-segmentation"
version = "1.0.0"
description = "PCA + K-Means bank customer segmentation pipeline and FastAPI service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.136.0",
    "httpx==0.28.1",
    "joblib==1.5.3",
    "numpy==2.4.4",
    "pandas==3.1.1",
    "pydantic==2.13.1",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "uvicorn==0.44.0",
]

[project.optional-dependencies]
dev = [
    "flake8==7.3.0",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.ipynb", ".venv", "venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
